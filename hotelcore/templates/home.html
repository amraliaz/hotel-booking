<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel Booking</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: white;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .price {
            color: #27ae60;
            font-weight: bold;
        }

        .section-title {
            color: white;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🏨 Hotel Booking System</h1>

    <div class="form-box">
        <h2>✨ Book a Room</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="guest_name" placeholder="👤 Guest Name" required>

            <select name="room">
                {% for room in rooms %}
                    <option value="{{ room.id }}">
                        Room {{ room.id }} - {{ room.price_per_night }} $
                    </option>
                {% endfor %}
            </select>

            <input type="date" name="check_in" required>
            <input type="date" name="check_out" required>

            <button type="submit">🚀 Book Now</button>
        </form>
    </div>

    <h2 class="section-title">📋 Reservations</h2>

    {% for r in reservations %}
    <div class="card">
        <h3>{{ r.guest_name }}</h3>
        <p>🛏 Room: {{ r.room }}</p>
        <p>📅 {{ r.check_in }} → {{ r.check_out }}</p>
        <p class="price">💰 {{ r.total_price }} $</p>
    </div>
    {% endfor %}

</div>

</body>
</html>
